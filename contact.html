<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | The Harvest Run</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1><a href="/">The Harvest Run</a></h1>
  <nav>
    <a href="/">Home</a>
    <a href="/aff2016">Austin Film Festival</a>
    <a href="/the-team">The Team</a>
    <a href="/contact" class="active">Contact</a>
  </nav>
</header>

<section class="page-band">
  <h2>Contact</h2>
</section>

<section class="contact">
  <h3 class="thanks">Thank you for visiting.</h3>
  <p class="lede">For comments about the film or to get in touch, please drop us a line.</p>

  <!-- Form submissions need a service to receive them. Set the action to that service's endpoint once it's chosen. -->
  <form class="contact-form" action="#" method="post">
    <label class="field">
      <span>Email <em>(required)</em></span>
      <input type="email" name="email" required>
    </label>

    <fieldset class="field">
      <legend>Name</legend>
      <div class="row">
        <label>
          <span>First Name <em>(required)</em></span>
          <input type="text" name="first_name" required>
        </label>
        <label>
          <span>Last Name <em>(required)</em></span>
          <input type="text" name="last_name" required>
        </label>
      </div>
    </fieldset>

    <label class="field">
      <span>Message</span>
      <textarea name="message" rows="6"></textarea>
    </label>

    <button type="submit">Submit</button>
  </form>
</section>

<footer>
  &copy; 2016 Rope Swing Studios. All rights reserved.
</footer>
</body>
</html>
